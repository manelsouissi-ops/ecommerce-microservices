<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Architecture diagram with n8n automation layer</title>
  <desc id="desc">Client connects to API Gateway through REST. API Gateway talks to three microservices through gRPC. OrderService publishes events to Kafka, which are consumed by InventoryService and NotificationService. n8n sits on top as a separate automation layer and sends webhooks to the API Gateway.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef3f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#f97316"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .section { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; letter-spacing: 0.2px; }
      .boxTitle { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .boxMeta { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: rgba(255,255,255,0.92); }
      .linkLabel { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #334155; background: transparent; }
      .node { filter: url(#shadow); rx: 18; ry: 18; }
      .client { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .gateway { fill: #2563eb; stroke: #1d4ed8; stroke-width: 2; }
      .service { fill: #16a34a; stroke: #15803d; stroke-width: 2; }
      .kafka { fill: #f97316; stroke: #ea580c; stroke-width: 2; }
      .n8n { fill: #7c3aed; stroke: #6d28d9; stroke-width: 2; }
      .groupCore { fill: rgba(15, 23, 42, 0.02); stroke: rgba(71, 85, 105, 0.24); stroke-width: 2; stroke-dasharray: 12 8; rx: 28; ry: 28; }
      .groupAuto { fill: rgba(124, 58, 237, 0.04); stroke: rgba(124, 58, 237, 0.35); stroke-width: 2; stroke-dasharray: 10 7; rx: 28; ry: 28; }
      .lineREST { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
      .lineGRPC { stroke: #16a34a; stroke-width: 4; fill: none; marker-end: url(#arrowGreen); }
      .lineKafka { stroke: #f97316; stroke-width: 4; fill: none; marker-end: url(#arrowOrange); }
      .lineWebhook { stroke: #7c3aed; stroke-width: 4; fill: none; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="70" class="title">Architecture e-commerce avec couche d'automatisation n8n</text>
  <text x="80" y="100" class="subtitle">Séparation visuelle entre le coeur microservices et l'orchestration no-code / low-code</text>

  <rect x="250" y="175" width="1090" height="560" class="groupCore"/>
  <text x="280" y="210" class="section">Coeur microservices</text>

  <rect x="515" y="60" width="575" height="110" class="groupAuto"/>
  <text x="545" y="95" class="section" fill="#6d28d9">Couche d'automatisation n8n</text>

  <!-- Nodes -->
  <rect x="80" y="360" width="160" height="90" class="node client"/>
  <text x="160" y="396" text-anchor="middle" class="boxTitle" fill="#0f172a">Client</text>
  <text x="160" y="422" text-anchor="middle" class="boxMeta" fill="#334155">Web / Mobile</text>

  <rect x="550" y="80" width="300" height="70" class="node n8n"/>
  <text x="700" y="110" text-anchor="middle" class="boxTitle">n8n Webhook</text>
  <text x="700" y="133" text-anchor="middle" class="boxMeta">Automation layer</text>

  <rect x="530" y="350" width="310" height="100" class="node gateway"/>
  <text x="685" y="392" text-anchor="middle" class="boxTitle">API Gateway</text>
  <text x="685" y="418" text-anchor="middle" class="boxMeta">REST + GraphQL • port 3000</text>

  <rect x="1080" y="250" width="300" height="100" class="node service"/>
  <text x="1230" y="292" text-anchor="middle" class="boxTitle">OrderService</text>
  <text x="1230" y="318" text-anchor="middle" class="boxMeta">gRPC • port 50051 • SQLite3</text>

  <rect x="1080" y="390" width="300" height="100" class="node service"/>
  <text x="1230" y="432" text-anchor="middle" class="boxTitle">InventoryService</text>
  <text x="1230" y="458" text-anchor="middle" class="boxMeta">gRPC • port 50052 • SQLite3</text>

  <rect x="1080" y="530" width="300" height="100" class="node service"/>
  <text x="1230" y="572" text-anchor="middle" class="boxTitle">NotificationService</text>
  <text x="1230" y="598" text-anchor="middle" class="boxMeta">gRPC • port 50053 • RxDB</text>

  <rect x="930" y="675" width="260" height="86" class="node kafka"/>
  <text x="1060" y="711" text-anchor="middle" class="boxTitle">Kafka Broker</text>
  <text x="1060" y="736" text-anchor="middle" class="boxMeta">topic: order.placed</text>

  <!-- Connections -->
  <path d="M240,405 C340,405 430,405 530,405" class="lineREST"/>
  <text x="385" y="386" class="linkLabel" text-anchor="middle">REST</text>

  <path d="M850,385 C930,350 990,330 1080,300" class="lineGRPC"/>
  <text x="985" y="322" class="linkLabel" text-anchor="middle">gRPC</text>

  <path d="M850,405 C930,405 990,425 1080,440" class="lineGRPC"/>
  <text x="985" y="392" class="linkLabel" text-anchor="middle">gRPC</text>

  <path d="M850,425 C930,450 990,500 1080,580" class="lineGRPC"/>
  <text x="985" y="488" class="linkLabel" text-anchor="middle">gRPC</text>

  <path d="M1230,350 C1200,460 1140,585 1060,675" class="lineKafka"/>
  <text x="1160" y="548" class="linkLabel" text-anchor="middle">Kafka</text>

  <path d="M1060,675 C1120,620 1170,560 1230,490" class="lineKafka"/>
  <text x="1150" y="594" class="linkLabel" text-anchor="middle">Kafka</text>

  <path d="M1060,675 C1125,650 1175,640 1230,630" class="lineKafka"/>
  <text x="1152" y="646" class="linkLabel" text-anchor="middle">Kafka</text>

  <path d="M700,150 C700,210 700,260 700,350" class="lineWebhook"/>
  <text x="720" y="248" class="linkLabel">Webhook</text>

  <!-- Legend -->
  <g transform="translate(80,820)">
    <rect x="0" y="0" width="1440" height="48" rx="14" ry="14" fill="#ffffff" stroke="#dbe3ef"/>
    <circle cx="32" cy="24" r="8" fill="#2563eb"/>
    <text x="48" y="29" class="subtitle">API Gateway</text>
    <circle cx="190" cy="24" r="8" fill="#16a34a"/>
    <text x="206" y="29" class="subtitle">Microservices</text>
    <circle cx="360" cy="24" r="8" fill="#f97316"/>
    <text x="376" y="29" class="subtitle">Kafka</text>
    <circle cx="470" cy="24" r="8" fill="#7c3aed"/>
    <text x="486" y="29" class="subtitle">n8n</text>
    <text x="620" y="29" class="subtitle">Labels de connexion: REST, gRPC, Kafka, Webhook</text>
  </g>
</svg>
