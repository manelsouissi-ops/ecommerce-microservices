syntax = "proto3";

package order;

// Ce que l'API Gateway peut demander à OrderService
service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (OrderResponse);
  rpc GetOrder    (GetOrderRequest)    returns (OrderResponse);
  rpc ListOrders  (ListOrdersRequest)  returns (ListOrdersResponse);
}

// Données envoyées pour créer une commande
message CreateOrderRequest {
  string product_id = 1;
  int32  quantity   = 2;
  string customer   = 3;
}

// Données envoyées pour récupérer une commande
message GetOrderRequest {
  string order_id = 1;
}

// Données envoyées pour lister les commandes
message ListOrdersRequest {}

// Une commande (ce que le service retourne)
message OrderResponse {
  string order_id   = 1;
  string product_id = 2;
  int32  quantity   = 3;
  string customer   = 4;
  string status     = 5;
}

// Liste de commandes
message ListOrdersResponse {
  repeated OrderResponse orders = 1;
}